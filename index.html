<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Debug Short.io</title>
  <style>body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; }</style>
</head>
<body>
  <h2>Depuración Short.io</h2>
  <button onclick="probarCambio()" style="padding: 15px; font-size: 16px; cursor: pointer;">PROBAR CAMBIO A MADRID</button>
  <pre id="log" style="background: #222; padding: 15px; margin-top: 20px; white-space: pre-wrap;"></pre>

  <script>
    async function probarCambio() {
      const logBox = document.getElementById("log");
      logBox.textContent = "Enviando petición...";
      
      try {
        const res = await fetch("https://api.short.io/links/link_8VG1_034p7R8qZR2sHzNdyzrCPS", {
          method: "POST",
          headers: {
            "Authorization": "sk_HTbp2QI8ylBB001q",
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({ originalURL: "https://sites.google.com/view/magoo70/mad" })
        });
        
        const texto = await res.text();
        logBox.textContent = `Código HTTP: ${res.status}\nRespuesta: ${texto}`;
      } catch (e) {
        logBox.textContent = `Error de red: ${e.message}`;
      }
    }
  </script>
</body>
</html>
