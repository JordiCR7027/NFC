<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controlador NFC Short.io</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --btn-bg: #262626;
      --btn-active: #007aff;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 25px;
      max-width: 400px;
      margin: 0 auto;
      background: var(--bg-color);
      color: var(--text-main);
      text-align: center;
    }

    h2 {
      font-size: 1.4rem;
      margin-bottom: 25px;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    button {
      padding: 22px 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 14px;
      border: none;
      background: var(--btn-bg);
      color: var(--text-main);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: transform 0.1s ease, background-color 0.2s ease;
      width: 100%;
    }

    button:active {
      transform: scale(0.96);
      background: var(--btn-active);
    }

    #status {
      margin-top: 30px;
      font-weight: 500;
      font-size: 0.95rem;
      color: var(--text-muted);
      word-break: break-all;
      background: var(--card-bg);
      padding: 14px;
      border-radius: 10px;
      text-align: left;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <h2>Controlador de Enlaces NFC</h2>

  <div class="grid">
    <button onclick="cambiarUrl('https://sites.google.com/view/magoo70/mad', 'MADRID')">MADRID</button>
    <button onclick="cambiarUrl('https://sites.google.com/view/magoo70/bcn', 'BARCELONA')">BARCELONA</button>
    <button onclick="cambiarUrl('https://sites.google.com/view/magoo70/val', 'VALENCIA')">VALENCIA</button>
    <button onclick="cambiarUrl('https://sites.google.com/view/magoo70/sev', 'SEVILLA')">SEVILLA</button>
  </div>

  <div id="status">Selecciona un destino para actualizar el enlace...</div>

  <script>
    // URL de tu Web App desplegada en Google Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwxYrfoyNl_IQU3zq-zYRT37ichQsYtAFcVltSA9pYGfOCs1Ji5GzUokrbSBp4enQ30/exec";

    async function cambiarUrl(nuevaUrl, nombre) {
      const status = document.getElementById("status");
      status.textContent = `Actualizando destino a ${nombre}...`;
      status.style.color = "#ff9500";

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ originalURL: nuevaUrl })
        });

        const text = await response.text();
        
        // Verificamos si la respuesta de Short.io contiene los datos del enlace modificado
        if (text.includes("originalURL") || text.includes("link_")) {
          status.textContent = `✓ ¡Enlace redirigido a ${nombre} con éxito!`;
          status.style.color = "#34c759";
        } else {
          status.textContent = `Respuesta: ${text}`;
          status.style.color = "#ff9500";
        }
      } catch (error) {
        status.textContent = `❌ Error de red: ${error.message}`;
        status.style.color = "#ff3b30";
      }
    }
  </script>

</body>
</html>
