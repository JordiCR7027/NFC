<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controlador NFC Short.io</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 25px; max-width: 400px; margin: 0 auto; background: #121212; color: #fff; text-align: center; }
    h2 { font-size: 1.3rem; margin-bottom: 25px; color: #ddd; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
    button {
      padding: 20px 10px; font-size: 16px; font-weight: bold; cursor: pointer;
      border-radius: 12px; border: none; background: #222; color: #fff;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.1s; width: 100%;
    }
    button:active { transform: scale(0.95); background: #007aff; }
    #status { margin-top: 30px; font-weight: 500; font-size: 1rem; color: #aaa; }
  </style>
</head>
<body>

  <h2>Controlador de Enlaces</h2>

  <div class="grid">
    <button onclick="cambiarUrl('https://sites.google.com/view/magoo70/mad', 'MADRID')">MADRID</button>
    <button onclick="cambiarUrl('https://sites.google.com/view/magoo70/bcn', 'BARCELONA')">BARCELONA</button>
    <button onclick="cambiarUrl('https://sites.google.com/view/magoo70/val', 'VALENCIA')">VALENCIA</button>
    <button onclick="cambiarUrl('https://sites.google.com/view/magoo70/sev', 'SEVILLA')">SEVILLA</button>
  </div>

  <div id="status">Pulsa un botón para cambiar el destino...</div>

  <script>
    const API_KEY = "sk_HTbp2QI8ylBB001q";
    const LINK_ID = "link_8VG1_034p7R8qZR2sHzNdyzrCPS";

    async function cambiarUrl(nuevaUrl, nombre) {
      const status = document.getElementById("status");
      status.textContent = `Actualizando a ${nombre}...`;
      status.style.color = "#ff9500";

      try {
        const response = await fetch(`https://api.short.io/links/${LINK_ID}`, {
          method: "POST",
          headers: {
            "Authorization": API_KEY,
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({ originalURL: nuevaUrl })
        });

        if (response.ok) {
          status.textContent = `✓ ¡Cambiado a ${nombre} con éxito!`;
          status.style.color = "#34c759";
        } else {
          const errData = await response.text();
          console.error("Respuesta de error:", errData);
          throw new Error("Error en la API");
        }
      } catch (error) {
        status.textContent = `❌ Error al actualizar.`;
        status.style.color = "#ff3b30";
      }
    }
  </script>

</body>
</html>
